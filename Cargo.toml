[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# 依存のバージョンはここで一元管理する。各クレートは `xxx.workspace = true` で参照する。
# 新しい依存は「使う時点で」追加する（先回りして入れない）。
[workspace.dependencies]
domain = { package = "ntpterminal-domain", path = "crates/domain" }
application = { package = "ntpterminal-application", path = "crates/application" }
infrastructure = { package = "ntpterminal-infrastructure", path = "crates/infrastructure" }
presentation = { package = "ntpterminal-presentation", path = "crates/presentation" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[workspace.lints.clippy]
# module は `foo.rs` + `foo/` 形式に統一する（`mod.rs` 禁止）
mod_module_files = "deny"

[package]
name = "ntpterminal"
description = "GNSS タイムサーバのデモ用 NTP クロック"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
domain.workspace = true
application.workspace = true
infrastructure.workspace = true
presentation.workspace = true
anyhow.workspace = true
clap.workspace = true

[lints]
workspace = true
